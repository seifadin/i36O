<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!--@@CSP@@-->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>البحث في &#x2066;i360إ&#x2069;</title>
  <meta name="description" content="ابحث في نصوص الكتب والمقالات المرتبطة بالموسوعة الإسلامية i360إ، مرتبةً حسب العلوم الشرعية.">

  <!-- Shared i360 theme (theme/ in this repo; https://theme.i36o.workers.dev):
       1. built-in colours, used until theme.css arrives and when it can't;
       2. the saved theme and the saved copy of theme.css, before anything is drawn;
       3. the loader (bundled into the page's script, so the theme button also works offline). -->
  <style id="i360-fallback">/*@@THEME_FALLBACK@@*/</style>
  <script>/*@@THEME_EARLY@@*/</script>
  <link rel="preconnect" href="/*@@THEME_ORIGIN@@*/" crossorigin>

  <style>
    /* Colours: the shared theme's own variables (--i360-…, hub/theme/site/theme.css), used directly;
       the theme is <html data-theme="…">. */
    :root { --page-w: var(--i360-content-width); }   /* the column's text width */


    body {
      font-family: var(--i360-font);   /* Amiri, from the shared theme */
      font-size: var(--i360-text-size);
      background-color: var(--i360-bg);
      color: var(--i360-text);
      line-height: var(--i360-line-height-ui);
      /* The page scrolls inside .scroller, not the window: browsers keep the
         window's scrollbar on the right even in Arabic, but put a
         right-to-left element's scrollbar on the left. */
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .scroller { flex: 1; min-height: 0; overflow-y: auto; direction: rtl; overscroll-behavior: contain; }
    .scroller:focus { outline: none; }

    /* ---------- Toolbar ---------- */
    /*@@PAGE_CHROME@@*/
    /* The bar and everything in it: src/page-chrome.css. Here: its place in the page. */
    .toolbar { flex-shrink: 0; z-index: var(--i360-layer-bar); }

    /* ---------- Search ---------- */
    /* The column, centred in the scrolling area, which keeps it clear of the screen's edges (.safe-area). */
    main { width: var(--page-w); max-width: 100%; margin: 0 auto; }

    .search-form { display: flex; gap: var(--i360-space-sm); }
    .search-input {
      flex: 1;
      min-width: 0;
      height: 2.75rem;
      padding: 0 var(--i360-space-md);
      border: var(--i360-line-width) solid var(--i360-border);
      border-radius: var(--i360-radius-lg);
      background: var(--i360-input);
      color: var(--i360-text);
      font-family: inherit;
      font-size: var(--i360-text-size);
      outline: none;
    }
    .search-input:focus { border-color: var(--i360-focus); box-shadow: var(--i360-focus-ring); }
    .search-btn {
      height: 2.75rem;
      padding: 0 var(--i360-space-md);
      border: none;
      border-radius: var(--i360-radius-lg);
      background: var(--i360-accent);
      color: var(--i360-on-accent);
      font-family: inherit;
      font-size: var(--i360-text-size);
      font-weight: 700;
      cursor: pointer;
    }

    .options { display: flex; flex-wrap: wrap; gap: var(--i360-space-sm); margin-top: var(--i360-space-sm); }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: var(--i360-space-xs);
      height: 2rem;
      padding: 0 var(--i360-space-sm);
      border: var(--i360-line-width) solid var(--i360-border);
      border-radius: var(--i360-radius-full);
      background: var(--i360-surface);
      color: var(--i360-text);
      font-family: inherit;
      font-size: var(--i360-text-size-sm);
      cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--i360-active); border-color: var(--i360-focus); color: var(--i360-heading); font-weight: 700; }
    .chip-box { width: 0.9rem; height: 0.9rem; border: var(--i360-line-width) solid currentColor; border-radius: var(--i360-radius-sm); display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem; line-height: 1; }
    .chip[aria-pressed="true"] .chip-box::after { content: '✓'; }

    .status { margin-top: var(--i360-space-md); color: var(--i360-muted); font-size: var(--i360-text-size-sm); min-height: 1.5rem; }
    .status.error {
      background: var(--i360-banner-bg);
      border: var(--i360-line-width) solid var(--i360-banner-border);
      color: var(--i360-banner-text);
      border-radius: var(--i360-radius-lg);
      padding: var(--i360-space-sm) var(--i360-space-md);
    }
    .status .retry { margin-inline-start: var(--i360-space-sm); font-family: inherit; font-size: var(--i360-text-size-sm); border: var(--i360-line-width) solid currentColor; background: transparent; color: inherit; border-radius: var(--i360-radius-lg); padding: 0 var(--i360-space-sm); cursor: pointer; }

    .about { margin-top: var(--i360-space-lg); color: var(--i360-text); font-size: var(--i360-text-size-sm); line-height: var(--i360-line-height); }

    /* ---------- Results ----------
       As in the app: each major opens and closes; rows without an
       intermediate sit directly under it; each intermediate opens and
       closes inside it. */
    .results-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--i360-space-sm); margin-top: var(--i360-space-md); }
    .results-bar .status { margin-top: 0; }
    .bar-btns { display: flex; gap: var(--i360-space-sm); }
    .count { font-size: var(--i360-text-size-sm); font-weight: 400; color: var(--i360-muted); font-variant-numeric: tabular-nums; }

    details.major { margin-top: var(--i360-space-md); background: var(--i360-surface); border: var(--i360-line-width) solid var(--i360-border); border-radius: var(--i360-radius-lg); }
    details.inter { margin-top: var(--i360-space-sm); border: var(--i360-line-width) solid var(--i360-border); border-radius: var(--i360-radius-lg); }
    details.major > summary, details.inter > summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: var(--i360-space-sm);
      padding: var(--i360-space-sm) var(--i360-space-md);
      cursor: pointer;
      font-weight: 400;   /* as the app's science list: size and place mark the levels; bold is the title's */
      color: var(--i360-heading);
      user-select: none;
      border-radius: var(--i360-radius-lg);   /* the keyboard focus ring follows the box's corners */
    }
    details.major > summary { font-size: var(--i360-text-size-lg); }
    details.major > summary:hover, details.inter > summary:hover { background: var(--i360-hover); border-radius: var(--i360-radius-lg); }
    details > summary::-webkit-details-marker { display: none; }
    details.major > summary::before, details.inter > summary::before { content: '◂'; color: var(--i360-muted); font-size: var(--i360-text-size-sm); transition: transform var(--i360-speed-quick); }
    details.major[open] > summary::before, details.inter[open] > summary::before { transform: rotate(-90deg); }
    .major-body { padding: 0 var(--i360-space-md) var(--i360-space-sm); }
    .inter-body { padding: 0 var(--i360-space-md) var(--i360-space-sm); }

    .source { padding-top: var(--i360-space-sm); }
    .source + .source { border-top: var(--i360-line-width) solid var(--i360-rule); margin-top: var(--i360-space-sm); }
    .source-name { font-weight: 700; color: var(--i360-heading); font-size: var(--i360-text-size); }
    .source-name .sep { color: var(--i360-muted); font-weight: 400; margin: 0 var(--i360-space-xs); }
    .source-name .file { font-weight: 700; }

    .hit { display: block; margin-top: var(--i360-space-xs); padding: var(--i360-space-xs) var(--i360-space-sm); border-radius: var(--i360-radius-lg); color: inherit; text-decoration: none; }
    .hit:hover { background: var(--i360-hover); }
    .hit-meta { display: flex; gap: var(--i360-space-sm); font-size: var(--i360-text-size-sm); color: var(--i360-link); font-weight: 700; }
    .hit-meta .more-spots { color: var(--i360-muted); font-weight: 400; }
    .hit-text { font-family: var(--i360-font); font-size: var(--i360-text-size); line-height: var(--i360-line-height); }
    .hit-text mark { background: var(--i360-highlight); color: inherit; border-radius: var(--i360-radius-sm); padding: 0 0.1rem; }

    .group-foot { margin-top: var(--i360-space-sm); display: flex; align-items: center; gap: var(--i360-space-sm); color: var(--i360-muted); font-size: var(--i360-text-size-sm); }
    .more-btn {
      font-family: inherit;
      font-size: var(--i360-text-size-sm);
      font-weight: 700;
      color: var(--i360-link);
      background: transparent;
      border: var(--i360-line-width) solid var(--i360-border);
      border-radius: var(--i360-radius-lg);
      padding: var(--i360-space-xs) var(--i360-space-md);
      cursor: pointer;
    }
    .more-btn:hover { background: var(--i360-hover); }
    .more-btn.icon-btn { display: inline-flex; align-items: center; padding: var(--i360-space-xs) var(--i360-space-sm); }
    /* Icons: Lucide (lucide.dev, ISC licence), drawn inline; checked by scripts/icons.js. Their
       sizes here; their drawing style for every page: src/page-chrome.css. */
    .icon-btn svg { width: var(--i360-icon-size); height: var(--i360-icon-size); }
  </style>
</head>
<body class="i360-page">
  <header class="toolbar">
    <!-- The name stays "i360إ" in Arabic text: a left-to-right isolate keeps
         the إ after "i360" (otherwise it shows as "إi360"), and a left-to-right
         mark before the إ keeps it there with Eastern digits ("i٣٦٠إ"). -->
    <!-- In Arabic from the right: theme · numerals … title · ✕ (i360-hub.md §10 "Toolbars"; ✕ only inside the app). -->
    <div class="tb-start">
      <button class="toolbar-btn" id="btn-theme" type="button"></button>
      <button class="toolbar-btn numerals-btn" id="btn-numerals" type="button"></button>
    </div>
    <div class="tb-title">البحث في <bdi dir="ltr">i360&lrm;إ</bdi></div>
    <button class="toolbar-btn" id="btn-close" type="button" aria-label="إغلاق" title="إغلاق" hidden><svg data-lucide="x" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
  </header>

  <div class="scroller safe-area safe-area-top-bar" id="scroller" tabindex="-1">
  <main>
    <form class="search-form" id="search-form" role="search" autocomplete="off">
      <input class="search-input" id="q" type="search" name="q" enterkeyhint="search" spellcheck="false" aria-label="نص البحث" placeholder="ابحث في نصوص الكتب…">
      <button class="search-btn" type="submit">بحث</button>
    </form>
    <div class="options">
      <button class="chip" id="opt-exact" type="button" aria-pressed="false" title="بدون هذا الخيار يُتجاهل التشكيل وتُعامل أ/إ/آ كـ ا، وة كـ ه، وى كـ ي"><span class="chip-box"></span>مطابقة التشكيل</button>
      <button class="chip" id="opt-word" type="button" aria-pressed="false" title="تجاهل النتائج التي تقع داخل كلمة أطول"><span class="chip-box"></span>كلمة كاملة</button>
    </div>

    <div class="results-bar">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="bar-btns" id="bar-btns" hidden>
        <button class="more-btn icon-btn" id="btn-expand" type="button" aria-label="توسيع الكل" title="توسيع الكل"><svg data-lucide="list-chevrons-up-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h8"></path><path d="M3 12h8"></path><path d="M3 19h8"></path><path d="m15 8 3-3 3 3"></path><path d="m15 16 3 3 3-3"></path></svg></button>
        <button class="more-btn icon-btn" id="btn-collapse" type="button" aria-label="طي الكل" title="طي الكل"><svg data-lucide="list-chevrons-down-up" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h8"></path><path d="M3 12h8"></path><path d="M3 19h8"></path><path d="m15 5 3 3 3-3"></path><path d="m15 19 3-3 3 3"></path></svg></button>
      </div>
    </div>
    <div id="results"></div>
    <div class="about" id="about"></div>
  </main>
  </div>

  <script>/*@@MAIN@@*/</script>
</body>
</html>
