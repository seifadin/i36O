<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!--@@CSP@@-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>التأمل اليومي</title>
  <!-- Shared i360 theme (theme/ in this repo; https://theme.i36o.workers.dev), filled in by
     scripts/build.js: built-in colours, the saved theme before anything is drawn (the
     loader is bundled into the page's script). -->
  <style id="i360-fallback">/*@@THEME_FALLBACK@@*/</style>
  <script>/*@@THEME_EARLY@@*/</script>
  <link rel="preconnect" href="/*@@THEME_ORIGIN@@*/" crossorigin>
  <style>
    /* Colours: the shared theme's own variables (--i360-…, hub/theme/site/theme.css), used directly;
       the theme is <html data-theme="…">. Behind the cards: --i360-frame (as behind the Reader's
       pages); the cards: --i360-bg. */
    /* Fonts from the shared theme: Amiri for every language, Amiri Quran for the verse. */
    body { font-family: var(--i360-font); background-color: var(--i360-frame); color: var(--i360-text); transition: all var(--i360-speed) ease; margin: 0; padding: 0; overflow-x: hidden; }
    .arabic-script, .hadith-text-style { font-family: var(--i360-font); line-height: var(--i360-line-height) !important; }
    .arabic-script.quran-verse { font-family: var(--i360-font-quran); }
    .text-quran { color: var(--i360-quran); }
    .bg-quran-soft { background-color: var(--i360-hover); }
    @supports (color: color-mix(in oklab, red, red)) { .bg-quran-soft { background-color: color-mix(in oklab, var(--i360-quran) 14%, transparent); } }
    .text-accent { color: var(--i360-accent); }
    /* Sizes, spacing, corners, lines and shadows: the shared theme's only (src/day.tailwind.js).
       Amiri has only regular (400) and bold (700), so only those are used. No extra letter
       spacing in Arabic script: it pulls joined letters apart. */
    [dir="rtl"] .tracking-widest { letter-spacing: normal !important; }
    /* Icons: Lucide (lucide.dev, ISC licence), drawn inline; checked by scripts/icons.js. Their
       sizes here; their drawing style for every page: src/page-chrome.css. */
    svg.icon { width: var(--i360-icon-size); height: var(--i360-icon-size); display: block; }
    svg.icon-inline { width: var(--i360-icon-size-inline); height: var(--i360-icon-size-inline); display: inline-block; vertical-align: -0.125em; }
    /* The cards (their look: .i360-card, the inner boxes .i360-inset, src/page-chrome.css): their padding
       grows with the screen (twice the shared gap), no width breakpoints. */
    .glass-card { padding: calc(2 * var(--i360-gap)); transition: all var(--i360-speed) ease; }
    .next-prayer-highlight { border: var(--i360-line-width-strong) solid var(--i360-accent) !important; background-color: var(--i360-hover); transform: scale(1.05); box-shadow: var(--i360-popup-shadow); border-radius: var(--i360-radius-lg); }
    [dir="ltr"] .arabic-script { direction: rtl; }
    .text-custom-secondary { color: var(--i360-muted); }
    /* The top bar (i360-hub.md §10 "Toolbars"): fixed at the top, as on every i360 page; in Arabic from
       the right: theme · numerals · language … title · ✕ (the ✕ in the installed app only); it mirrors in
       left-to-right languages. The bar and everything in it: src/page-chrome.css (toolbar-sticky: it stays
       at the top while the page scrolls; its row lines up with the page column, --toolbar-row-w). */
    /*@@PAGE_CHROME@@*/
    .toolbar { --toolbar-row-w: var(--col); z-index: var(--i360-layer-bar); }
    #btn-lang { gap: var(--i360-space-xs); font-weight: 700; line-height: 1; }
    .toolbar-btn .tb-caret { width: 0.875rem; height: 0.875rem; }
    .tb-title { margin: 0; }
    .lang-wrap { position: relative; flex-shrink: 0; }
    /* The language list (its look: .i360-popup; each language: .i360-list-item). */
    .lang-list { position: absolute; top: calc(100% + var(--i360-space-xs)); inset-inline-start: 0; z-index: var(--i360-layer-menu); min-width: 11rem; display: flex; flex-direction: column; gap: var(--i360-space-xs); }
    .lang-list[hidden] { display: none; }
    /* Its padding: .safe-area .safe-area-top-bar (page-chrome.css). */
    .page { width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
    /* The page column (--col, as before) and the cards (Seif 2026-10-26): one column, in this order,
       wherever two don't fit; where two columns of at least --col-min fit, the verse and hadith on
       one side and prayer times above the events on the other. Which one it is follows the space
       itself (CSS grid, auto-fit); Cols.fit() then measures it and gives the second column the first's
       height when its own content is taller (the events list scrolls within it; never less than its
       first three events), otherwise its own height. */
    :root { --col: var(--i360-content-width); --col-min: calc(var(--i360-content-width) / 2); --col-gap: var(--i360-space-lg); }
    .layout-stable { width: 100%; max-width: var(--col); margin: 0 auto; transition: transform var(--i360-speed) ease; }
    .cards { width: 100%; max-width: calc(2 * var(--col) + var(--col-gap)); margin: 0 auto; display: grid; gap: var(--col-gap);
         grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--col-min)), 1fr)); align-items: start; }
    .cards-col { width: 100%; max-width: var(--col); justify-self: center; min-width: 0; display: flex; flex-direction: column; gap: var(--col-gap); }
    body.two-cols .toolbar { --toolbar-row-w: calc(2 * var(--col) + var(--col-gap)); }
    body.two-cols #events-card { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    body.two-cols #events-card [data-target="events-list"] { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  </style>
  <style id="tailwind">/*@@TAILWIND@@*/</style>   <!-- built from src/day.tailwind.js (scripts/build.js) -->
</head>
<body class="i360-page min-h-screen flex flex-col items-center">
  <header class="toolbar toolbar-sticky">
    <!-- The shared theme and numerals (the same order on every i360 page), then the language. -->
    <div class="tb-start">
      <button id="btn-theme" type="button" class="toolbar-btn"></button>
      <button id="btn-numerals" type="button" class="toolbar-btn numerals-btn"></button>
      <div class="lang-wrap">
        <button id="btn-lang" type="button" class="toolbar-btn" aria-haspopup="true" aria-expanded="false" aria-controls="lang-list"><span id="lang-short"></span><svg data-lucide="chevron-down" class="tb-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <!-- dir="rtl" keeps the list in a fixed order; each language is written in its own language. -->
        <div id="lang-list" class="lang-list i360-popup" dir="rtl" role="group" aria-labelledby="btn-lang" hidden>
          <button type="button" data-lang="ar" id="lang-ar" lang="ar" class="i360-list-item">العربية</button>
          <button type="button" data-lang="ur" id="lang-ur" lang="ur" class="i360-list-item">اردو</button>
          <button type="button" data-lang="id" id="lang-id" lang="id" dir="ltr" class="i360-list-item">Bahasa Indonesia</button>
          <button type="button" data-lang="tr" id="lang-tr" lang="tr" dir="ltr" class="i360-list-item">Türkçe</button>
          <button type="button" data-lang="en" id="lang-en" lang="en" dir="ltr" class="i360-list-item">English</button>
        </div>
      </div>
    </div>
    <h1 data-i18n="title" class="tb-title">Daily Reflection</h1>
    <!-- Inside the installed i360إ app only: back to its home; last, so at the far end in either direction. -->
    <button id="btn-close" type="button" class="toolbar-btn" hidden><svg data-lucide="x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
  </header>

  <div class="page safe-area safe-area-top-bar">
  <div class="layout-stable flex flex-col gap-xs mb-lg text-center">
    <p class="text-custom-secondary text-base font-bold" data-target="current-date"></p>
    <p class="text-accent text-sm font-bold" data-target="hijri-date"></p>
    <p class="text-custom-secondary text-sm" data-target="hijri-source"></p>
  </div>

  <main id="cards" class="cards">
    <div class="cards-col" id="col-a">
    <section id="quran-card" class="glass-card i360-card opacity-0 translate-y-4 transition-all duration-500">
      <div class="flex items-center gap-sm mb-md">
        <span class="bg-quran-soft text-quran p-sm rounded-lg"><svg data-lucide="moon-star" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5h4"></path><path d="M20 3v4"></path><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg></span>
        <h2 data-i18n="quranLabel" class="text-sm font-bold uppercase tracking-widest text-quran">Quranic Verse</h2>
      </div>
      <div class="space-y-md">
        <p data-target="quran-arabic" class="arabic-script quran-verse text-lg font-bold text-justify mb-md"></p>
        <p data-target="quran-translation" class="text-base leading-reading italic text-custom-secondary text-justify"></p>
        <p data-target="quran-ref" class="text-base font-bold text-quran border-t border-rule pt-md"></p>
      </div>
      <div data-status="quran" class="hidden items-center gap-sm text-sm text-custom-secondary mt-md"><span data-status-text></span><button data-retry type="button" class="i360-btn i360-btn-sm"></button></div>
    </section>

    <section id="hadith-card" class="glass-card i360-card opacity-0 translate-y-4 transition-all duration-500">
      <div class="flex items-center gap-sm mb-md">
        <span class="bg-hadith-bg text-hadith p-sm rounded-lg"><svg data-lucide="book-open" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v16"></path><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"></path></svg></span>
        <h2 data-i18n="hadithLabel" class="text-base font-bold uppercase tracking-widest text-hadith">Hadith</h2>
      </div>
      <div class="space-y-md">
        <p data-target="hadith-title" class="text-base font-bold text-custom-secondary"></p>
        <div class="space-y-sm">
          <p data-target="hadith-narrator" class="hidden hadith-text-style text-base text-hadith font-bold"></p>
          <p data-target="hadith-text" class="hadith-text-style text-base text-custom-secondary font-bold text-justify"></p>
        </div>
        <div class="border-t border-rule pt-md space-y-xs text-base font-bold text-hadith">
          <p data-target="hadith-grade"></p>
          <details id="hadith-refs" class="hidden font-bold text-sm">
            <summary data-i18n="refsLabel" class="cursor-pointer font-bold text-base">References</summary>
            <p data-target="hadith-ref" class="mt-sm font-bold whitespace-pre-line"></p>
          </details>
          <p class="font-bold text-sm"><span data-i18n="sourceLabel">Source</span>: <a data-target="hadith-link" href="https://hadeethenc.com/" target="_blank" rel="noopener noreferrer" class="underline">HadeethEnc.com</a></p>
        </div>
      </div>
      <div data-status="hadith" class="hidden items-center gap-sm text-sm text-custom-secondary mt-md"><span data-status-text></span><button data-retry type="button" class="i360-btn i360-btn-sm"></button></div>
    </section>

    </div>
    <div class="cards-col" id="col-b">
    <section id="prayer-card" class="glass-card i360-card opacity-0 translate-y-4 transition-all duration-500">
      <div class="flex items-center gap-sm mb-md">
        <span class="bg-prayer-bg text-prayer p-sm rounded-lg"><svg data-lucide="clock" class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></span>
        <h2 data-i18n="prayerLabel" class="text-base font-bold uppercase tracking-widest text-prayer">Prayer Times</h2>
      </div>
      <div data-target="prayer-grid" class="grid grid-cols-3 gap-sm mb-md"></div>
      <div data-status="prayer" class="hidden items-center gap-sm text-sm text-custom-secondary mb-md"><span data-status-text></span><button data-retry type="button" class="i360-btn i360-btn-sm"></button></div>
      <div class="flex flex-wrap gap-md text-sm text-custom-secondary i360-inset p-md">
        <div class="flex flex-col gap-xs flex-auto">
          <p><span class="font-bold" data-i18n="methodLabel">Method:</span> <span data-target="meta-method">...</span></p>
          <p class="flex flex-wrap items-center gap-xs"><span class="font-bold" data-i18n="madhabLabel">Madhab:</span>
            <button type="button" id="school-0" data-school="0" class="i360-chip" aria-pressed="false"><span class="i360-chip-box"></span><span data-i18n="schoolStd"></span></button>
            <button type="button" id="school-1" data-school="1" class="i360-chip" aria-pressed="false"><span class="i360-chip-box"></span><span data-i18n="schoolHanafi"></span></button>
          </p>
        </div>
        <div class="flex flex-col gap-xs flex-auto">
          <p class="flex flex-wrap items-center gap-xs"><span class="font-bold" data-i18n="locLabel">Location:</span> <span data-target="meta-location">...</span>
            <button type="button" id="city-change" data-i18n="cityChange" aria-expanded="false" aria-controls="city-picker" class="i360-btn i360-btn-sm"></button></p>
          <p><span class="font-bold" data-i18n="tzLabel">Timezone:</span> <span data-target="meta-timezone">...</span></p>
        </div>
      </div>
      <!-- The city picker: Open-Meteo's place search (GeoNames data), asked only from here. -->
      <div id="city-picker" class="hidden mt-md i360-inset p-md flex-col gap-sm">
        <input id="city-search" type="search" autocomplete="off" spellcheck="false" class="i360-field i360-field-search w-full px-md py-sm">
        <p data-target="city-status" class="text-sm text-custom-secondary" role="status" aria-live="polite"></p>
        <div data-target="city-results" class="flex flex-col gap-xs" role="listbox"></div>
      </div>
    </section>

    <section id="events-card" class="glass-card i360-card opacity-0 translate-y-4 transition-all duration-500">
      <div class="flex items-center gap-sm mb-md">
        <span class="bg-event-bg text-event p-sm rounded-lg"><svg data-lucide="calendar-check" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v3"></path><path d="M16 2v3"></path><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18"></path><path d="m9 15 2 2 4-4"></path></svg></span>
        <h2 data-i18n="eventsLabel" class="text-base font-bold uppercase tracking-widest text-event">Upcoming Events</h2>
      </div>
      <div data-target="events-list" class="space-y-md"></div>
    </section>
    </div>
  </main>
  </div>
  <footer class="mt-lg text-center text-custom-secondary text-sm pb-lg">
    <p data-i18n="footer">Updated daily.</p>
    <p data-i18n="privacy" class="mt-sm max-w-[var(--col-min)] mx-auto whitespace-pre-line"></p>
    <p data-target="credits" class="mt-sm max-w-[var(--col-min)] mx-auto"></p>
  </footer>

  <script>/*@@MAIN@@*/</script>
</body>
</html>
