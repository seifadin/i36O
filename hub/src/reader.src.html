<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!--@@CSP@@-->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>قارئ الماركداون</title>

  <!-- Shared i360 theme (theme/ in this repo; https://theme.i36o.workers.dev):
       1. built-in colours, used until theme.css arrives and when it can't;
       2. the saved theme and the saved copy of theme.css, before anything is drawn;
       3. the loader (bundled into the page's script, so the theme button also works offline). -->
  <style id="i360-fallback">/*@@THEME_FALLBACK@@*/</style>
  <script>/*@@THEME_EARLY@@*/</script>
  <link rel="preconnect" href="/*@@THEME_ORIGIN@@*/" crossorigin>

  <style>
    /* Colours: the shared theme's own variables (--i360-…, hub/theme/site/theme.css), used directly;
       the theme is <html data-theme="…">. The desk behind the pages: --i360-frame. */
    :root {
      --page-w: var(--i360-content-width);   /* set from JS: min(--page-max, available width), in px */
      --page-max: var(--i360-content-width);   /* widest page: about an A4 sheet at the reader's own font size */
      --page-min: 15rem;            /* narrowest page */
      --text-scale: 1;              /* text size, separate from zoom */
      --container-gap: var(--safe-gap);   /* the shared gap (page-chrome.css), also between pages */
    }


    body {
      font-family: var(--i360-font);   /* Amiri, from the shared theme */
      background-color: var(--i360-frame);
      color: var(--i360-text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---------- Toolbar ---------- */
    /*@@PAGE_CHROME@@*/
    /* The bar and everything in it: src/page-chrome.css. Here: its place among the Reader's layers,
       and its own content — the page arrows and number, the connection icon, «فتح ملف». */
    .toolbar { z-index: var(--i360-layer-bar); }
    /* The page arrows: no padding of their own (the page number box has it); they keep their places
       whatever the language: in an RTL book the left one is "next". */
    #group-nav { direction: ltr; }
    .tb-main > #group-nav { padding: 0; }
    /* The line before copy link, while the page actions are on the bar. */
    .tb-main > .divider { margin: 0; }
    .toolbar.acts-folded .tb-main > .divider { display: none; }
    .tb-end > .tb-title { max-width: 14rem; flex-shrink: 0; }

    /* Icons: Lucide (lucide.dev, ISC licence), drawn inline; checked by scripts/icons.js. Their
       sizes here; their drawing style for every page: src/page-chrome.css. */
    .status-icon svg, .floating-btn svg { width: var(--i360-icon-size); height: var(--i360-icon-size); }
    #btn-bookmark[aria-pressed="true"] svg { fill: var(--i360-ribbon); stroke: var(--i360-ribbon); }
    #btn-bookmark[aria-pressed="true"] { background-color: transparent; }

    .text-size-btn { font-weight: 700; font-family: var(--i360-font); gap: 0; }
    .text-size-btn small { font-size: 0.75em; font-weight: 700; }

    .page-counter {
      display: flex;
      align-items: center;
      gap: var(--i360-space-xs);
      font-size: var(--i360-text-size-sm);
      color: var(--i360-text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    /* Their look: .i360-field (src/page-chrome.css). */
    .page-input, .vol-select {
      height: 1.75rem;
      font-size: var(--i360-text-size-sm);
    }
    .page-input { width: 3.4rem; text-align: center; }
    .vol-select { padding: 0 var(--i360-space-xs); max-width: 5.5rem; }

    /* Connection: green online (the theme's Quran green, in every theme), red offline (live). Its words show only inside the ⋮ menu. */
    .status-icon { display: flex; align-items: center; gap: var(--i360-space-sm); padding: 0 var(--i360-space-xs); color: var(--i360-quran); font-size: var(--i360-text-size-sm); }
    .status-icon.offline { color: var(--i360-danger); }
    .status-text { display: none; }
    .toolbar-menu .status-icon { height: 2rem; padding: 0 var(--i360-space-sm); }
    .toolbar-menu .status-text { display: inline; }

    /* Progress: its own row under the toolbar (the book starts below it), the label and the
       bar on one line — downloading a book from lib, then building its pages. Two-digit
       percentages in fixed-width digits, so the label never changes width. */
    .progress {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: var(--i360-space-sm);
      padding-top: var(--i360-space-xs);          /* its sides: .safe-sides */
      padding-bottom: var(--i360-space-xs);
      background: var(--i360-toolbar);
      border-bottom: var(--i360-line-width) solid var(--i360-border);
      font-size: var(--i360-text-size-sm);
      line-height: var(--i360-line-height-ui);
      color: var(--i360-text);
    }
    body.reading .progress { display: none; }
    .progress-text { white-space: nowrap; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .progress-track { display: block; flex: 1; min-width: 3rem; height: var(--i360-bar-width); background: var(--i360-rule); border-radius: var(--i360-radius-sm); overflow: hidden; }
    .progress-fill { display: block; height: 100%; width: 0; background: var(--i360-accent); transition: width var(--i360-speed) linear; }
    /* The moving stripe slides by transform, which the browser draws on its own track: it keeps
       moving even while the page is busy (a margin animation froze with it, and looked stuck). */
    .progress.indeterminate .progress-fill { width: 30%; will-change: transform; animation: progress-slide 1.2s ease-in-out infinite; }
    /* Direction as the page shows it: the body's, set from the book (the html tag stays rtl). */
    html[dir="rtl"] body:not([dir="ltr"]) .progress.indeterminate .progress-fill,
    body[dir="rtl"] .progress.indeterminate .progress-fill { animation-name: progress-slide-rtl; }
    @keyframes progress-slide { from { transform: translateX(-100%); } to { transform: translateX(334%); } }
    @keyframes progress-slide-rtl { from { transform: translateX(100%); } to { transform: translateX(-334%); } }
    @media (prefers-reduced-motion: reduce) { .progress.indeterminate .progress-fill { animation: none; width: 100%; opacity: 0.4; } }

    /* The ⋮ menu's first row (search, «فتح ملف», the connection icon) shows once they fold into it. */
    .toolbar:not(.folded) #group-fold { display: none; }

    /* What the Reader's own folding levels do to its own content (fitToolbar, src/reader/panel.js;
       the buttons' spacing and narrowest widths at the last levels: src/page-chrome.css). */
    .toolbar.notitle .tb-title { display: none; }
    .toolbar.folded .page-input { width: 2.8rem; }
    .toolbar.toolbar-dense .page-counter { gap: var(--i360-space-xs); font-size: var(--i360-text-size-sm); }
    .toolbar.toolbar-dense .page-input { width: 2.4rem; }
    .toolbar.toolbar-dense .vol-select { max-width: 3.6rem; }
    .toolbar.no-total #lbl-of, .toolbar.no-total #total-pages { display: none; }
    .toolbar.toolbar-densest .page-input { width: 2rem; }
    /* Position in the file, next to the printed page number (as Acrobat shows page labels) */
    .page-pos { color: var(--i360-muted); font-size: 0.8em; }
    .toolbar.nopos .page-pos { display: none; }
    .toolbar-menu .vol-select { max-width: none; height: 2rem; }

    /* ---------- Notices banner ---------- */
    .missing-pages-banner {
      width: var(--page-w);
      max-width: 100%;
      margin: 0 auto var(--container-gap);
      display: none;   /* its look: .i360-banner */
      align-items: flex-start;
      gap: var(--i360-space-md);
    }
    .missing-pages-banner.visible { display: flex; }
    .missing-pages-banner svg { width: var(--i360-icon-size); height: var(--i360-icon-size); stroke: currentColor; flex-shrink: 0; }
    .missing-pages-text { flex: 1; }
    .missing-pages-text div + div { margin-top: var(--i360-space-xs); }

    .empty-state {
      display: none;
      margin: 18vh auto 0;
      max-width: 22rem;
      text-align: center;
      color: var(--i360-muted);
      font-size: var(--i360-text-size);
      line-height: var(--i360-line-height-ui);
    }
    .empty-state.visible { display: block; }

    /* ---------- Viewer ---------- */
    .viewer-container {
      flex: 1;
      overflow: auto;
      /* padding: .safe-area .safe-area-top-bar (page-chrome.css) */
      width: 100%;
      overscroll-behavior: contain;
    }
    .viewer-container:focus { outline: none; }

    .pages-wrapper {
      display: flex;
      flex-direction: column;
      gap: var(--container-gap);
      width: var(--page-w);
      margin-inline: auto;
    }

    .page-sheet {
      background-color: var(--i360-bg);
      color: var(--i360-text);
      width: 100%;
      min-height: calc(var(--page-w) * 1.4142);
      padding: clamp(1.5rem, 4vw, 3.5rem) clamp(1.25rem, 3.5vw, 3rem) clamp(1rem, 2vw, 1.5rem);
      box-shadow: var(--i360-page-shadow);
      border-radius: var(--i360-radius-sm);
      position: relative;
      overflow-wrap: break-word;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      font-size: calc(var(--i360-text-size) * var(--text-scale));
      /* Far pages are skipped and not watched (hidden); pages near the screen are watched by the
         browser and drawn as they come into view (auto). Chrome watches every 'auto' page on every
         frame something changes, which on a 3,000-page book took a third of each frame (updateNear). */
      content-visibility: hidden;
      contain-intrinsic-size: auto var(--page-w) calc(var(--page-w) * 1.4142);
    }
    .page-sheet.near { content-visibility: auto; }
    /* Bookmark ribbon at the page's top corner */
    .page-sheet.bookmarked::before {
      content: "";
      position: absolute;
      top: 0;
      inset-inline-end: var(--i360-space-md);
      width: 0.9rem;
      height: 1.6rem;
      background: var(--i360-ribbon);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%);
    }

    .page-content { flex: 1; display: flex; flex-direction: column; }
    .markdown-body { flex: 1; }

    .page-sheet[dir="rtl"] { direction: rtl; font-family: var(--i360-font); }
    .page-sheet[dir="ltr"] { direction: ltr; font-family: var(--i360-font); }

    .page-sheet h1, .page-sheet h2, .page-sheet h3, .page-sheet h4, .page-sheet h5, .page-sheet h6 {
      margin-top: 1.1em;
      margin-bottom: 0.55em;
      font-weight: 700;
      line-height: var(--i360-line-height);
      color: var(--i360-heading);
      text-align: start;
      scroll-margin-top: var(--i360-space-md);
    }
    .page-sheet .markdown-body > :first-child { margin-top: 0; }
    .page-sheet h1 { font-size: 1.75em; border-bottom: var(--i360-line-width-strong) solid var(--i360-rule); padding-bottom: 0.25em; }
    .page-sheet h2 { font-size: 1.45em; border-bottom: var(--i360-line-width) solid var(--i360-rule); padding-bottom: 0.15em; }
    .page-sheet h3 { font-size: 1.25em; }
    .page-sheet h4 { font-size: 1.12em; }
    .page-sheet h5, .page-sheet h6 { font-size: 1em; }

    .page-sheet p {
      margin-bottom: 0.9em;
      line-height: var(--i360-line-height);
      font-size: 1.1em;
      text-align: justify;
      text-justify: inter-word;
    }
    .page-sheet ul, .page-sheet ol { margin-bottom: 1em; padding-inline-start: 2em; font-size: 1.1em; }
    .page-sheet li { margin-bottom: 0.4em; line-height: var(--i360-line-height); text-align: justify; text-justify: inter-word; }
    /* Nested lists (mind maps, trees): same text size at every level, with a
       guide line joining each branch to its parent */
    .page-sheet .sublist {
      font-size: 1em;
      margin: 0.35em 0 0.2em;
      padding-inline-start: 1.4em;
      border-inline-start: var(--i360-line-width) solid var(--i360-rule);
      margin-inline-start: 0.2em;
    }
    .page-sheet .sublist > li { position: relative; margin-bottom: 0.25em; }
    /* Mind-map boxes are short labels: justifying them would stretch the gaps */
    .page-sheet li:has(> .sublist), .page-sheet .sublist li { text-align: start; }
    /* Items separated by blank lines hold a <p>: same size and spacing as tight items */
    .page-sheet li > p { font-size: inherit; margin-bottom: 0; }

    .page-sheet blockquote {
      text-align: justify;
      text-justify: inter-word;
      border-inline-start: var(--i360-bar-width) solid var(--i360-link);
      background-color: var(--i360-quote);
      padding: var(--i360-space-sm) var(--i360-space-md);
      margin: 1.2em 0;
    }
    .page-sheet blockquote p:last-child { margin-bottom: 0; }

    /* Tables: a wide table scrolls sideways inside the page instead of
       squeezing its columns; the first column follows the page direction
       (rightmost in Arabic). Cells stay aligned to their start, not justified. */
    .page-sheet .table-wrap { overflow-x: auto; margin: 1.2em 0; max-width: 100%; }
    .page-sheet table { width: 100%; border-collapse: collapse; font-size: 1em; }
    .page-sheet th, .page-sheet td {
      border: var(--i360-line-width) solid var(--i360-rule);
      padding: var(--i360-cell-padding);
      text-align: start;
      vertical-align: top;
      line-height: var(--i360-line-height);
      min-width: 3.5em;
    }
    .page-sheet th { background-color: var(--i360-code); font-weight: 700; }
    .page-sheet tbody tr:nth-child(even) td { background-color: color-mix(in srgb, var(--i360-code) 45%, transparent); }
    .page-sheet table.no-head thead { display: none; }

    /* "[شكل]" / "[شكل: caption]": a figure in the book that the text can't show */
    .page-sheet p.figure-label {
      display: inline-block;
      text-align: start;
      font-family: var(--i360-font);
      font-size: 0.95em;
      color: var(--i360-muted);
      border: var(--i360-line-width) dashed var(--i360-rule);
      border-radius: var(--i360-radius-lg);
      padding: 0.2em 0.75em;
      margin-bottom: 0.5em;
    }

    .page-sheet code { background-color: var(--i360-code); padding: 0 var(--i360-space-xs); border-radius: var(--i360-radius-sm); font-family: monospace; font-size: 0.9em; }
    .page-sheet pre {
      background-color: var(--i360-code);
      color: var(--i360-text);
      padding: var(--i360-space-md);
      border-radius: var(--i360-radius-lg);
      overflow-x: auto;
      margin: 1.2em 0;
      direction: ltr;
      text-align: left;
    }
    .page-sheet pre code { background-color: transparent; padding: 0; color: inherit; }
    .page-sheet hr { border: 0; height: var(--i360-line-width); background: var(--i360-rule); margin: 1.5em 0; }
    .page-sheet a { color: var(--i360-link); }

    /* Quran quotations: Amiri Quran, from the shared theme. */
    .quran {
      font-family: var(--i360-font-quran);
      font-size: 1.05em;
      color: var(--i360-quran);
    }

    .footnotes { margin-top: auto; padding-top: var(--i360-space-md); }
    .footnotes::before {
      content: "";
      display: block;
      width: 35%;
      min-width: 8rem;
      border-top: var(--i360-line-width) solid var(--i360-muted);
      margin-bottom: var(--i360-space-sm);
    }
    .footnotes-list { font-size: 0.92em; line-height: var(--i360-line-height); color: var(--i360-note); }
    .fn-note { margin-bottom: 0.3em; text-align: justify; text-justify: inter-word; }
    .fn-back, .fn-ref { color: var(--i360-link); text-decoration: none; }
    .fn-back:hover, .fn-ref:hover { text-decoration: underline; }
    .fn-back { margin-inline-end: 0.3em; }
    .fn-ref { font-size: 0.78em; vertical-align: super; line-height: 0; }
    .flash { animation: flash 1.6s ease-out; border-radius: var(--i360-radius-sm); }
    @keyframes flash { 0%, 40% { background-color: var(--i360-highlight); } 100% { background-color: transparent; } }

    .page-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--i360-muted);
      font-family: var(--i360-font);
      font-size: var(--i360-text-size);
      border: var(--i360-line-width) dashed var(--i360-rule);
      border-radius: var(--i360-radius-lg);
      padding: var(--i360-space-lg) var(--i360-space-md);
      text-align: center;
    }

    .page-number-footer {
      text-align: center;
      font-size: var(--i360-text-size-sm);
      color: var(--i360-muted);
      padding-top: var(--i360-space-sm);
      margin-top: var(--i360-space-md);
      border-top: var(--i360-line-width) dashed var(--i360-rule);
      font-family: var(--i360-font);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Search popup ---------- */
    .search-popup {
      position: absolute;
      top: calc(var(--toolbar-h) + var(--i360-space-sm) + env(safe-area-inset-top));
      inset-inline-end: var(--i360-space-md);
      width: min(26rem, calc(100vw - 1.5rem));
      display: none;   /* its look: .i360-popup */
      flex-direction: column;
      gap: var(--i360-space-sm);
      z-index: var(--i360-layer-popup);
    }
    .search-popup.active { display: flex; }
    .search-row { display: flex; align-items: center; gap: var(--i360-space-xs); }
    .search-input { flex: 1; min-width: 0; padding: var(--i360-space-xs) var(--i360-space-md); }   /* its look: .i360-field */
    .search-count { font-size: var(--i360-text-size-sm); color: var(--i360-muted); min-width: 3.6rem; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
    /* The options: .i360-chip. */
    .search-results {
      list-style: none;
      max-height: min(45vh, 22rem);
      overflow-y: auto;
      border-top: var(--i360-line-width) solid var(--i360-border);
      margin: 0 calc(-1 * var(--i360-space-sm)) calc(-1 * var(--i360-space-sm));
      padding: var(--i360-space-xs) 0;
    }
    /* Each result: .i360-list-item. */
    .search-results .res-page { display: block; font-family: var(--i360-font); font-size: var(--i360-text-size-sm); color: var(--i360-muted); }
    .search-results .res-more { padding: var(--i360-space-sm); font-size: var(--i360-text-size-sm); color: var(--i360-muted); }

    ::highlight(search) { background-color: var(--i360-highlight); color: inherit; }
    ::highlight(search-active) { background-color: var(--i360-highlight-active); color: inherit; }

    /* ---------- Side panel: contents and bookmarks ---------- */
    .side-panel {
      position: fixed;
      top: calc(var(--toolbar-h) + env(safe-area-inset-top));
      bottom: 0;
      inset-inline-start: 0;
      width: min(20rem, 88vw);
      background: var(--i360-surface);
      border-inline-end: var(--i360-line-width) solid var(--i360-border);
      box-shadow: var(--i360-popup-shadow);
      z-index: calc(var(--i360-layer-bar) - 1);   /* under the toolbar, as before */
      display: flex;
      flex-direction: column;
      transform: translateX(105%);
      transition: transform var(--i360-speed) ease-out, visibility var(--i360-speed);
      visibility: hidden;
    }
    body[dir="ltr"] .side-panel { transform: translateX(-105%); }
    .side-panel.open { transform: none !important; visibility: visible; }
    .panel-head {
      display: flex;
      align-items: center;
      gap: var(--i360-space-xs);
      padding: var(--i360-space-sm);
      border-bottom: var(--i360-line-width) solid var(--i360-border);
    }
    .panel-tab {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--i360-muted);
      font-family: inherit;
      font-size: var(--i360-text-size-sm);
      font-weight: 700;
      padding: var(--i360-space-sm) var(--i360-space-xs);
      border-radius: var(--i360-radius-lg);
      cursor: pointer;
    }
    .panel-tab[aria-selected="true"] { background: var(--i360-active); color: var(--i360-heading); }
    /* Its close and remove buttons: .toolbar-btn. */
    .panel-body { flex: 1; overflow-y: auto; padding: var(--i360-space-xs) 0; }
    .panel-list { list-style: none; }
    .panel-item { display: flex; align-items: baseline; gap: var(--i360-space-sm); padding: var(--i360-space-sm) var(--i360-space-md); }   /* its look: .i360-list-item */
    .panel-item .item-text { flex: 1; min-width: 0; }
    .panel-item .item-page { font-family: var(--i360-font); font-size: var(--i360-text-size-sm); color: var(--i360-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .panel-item.lvl-1, .panel-item.lvl-2 { font-weight: 700; }
    .panel-item.lvl-3 { padding-inline-start: calc(2 * var(--i360-space-md)); }
    .panel-item.lvl-4 { padding-inline-start: calc(3 * var(--i360-space-md)); }
    .bm-row { display: flex; align-items: center; }
    .bm-row .panel-item { flex: 1; }
    .panel-empty { padding: var(--i360-space-md); color: var(--i360-muted); font-size: var(--i360-text-size-sm); line-height: var(--i360-line-height-ui); text-align: center; }

    /* ---------- Reading mode ---------- */
    .floating-btn {
      position: fixed;
      top: calc(var(--i360-space-sm) + env(safe-area-inset-top));
      inset-inline-end: var(--i360-space-sm);
      z-index: var(--i360-layer-dialog);
      width: 2.5rem;
      height: 2.5rem;
      border-radius: var(--i360-radius-full);
      border: var(--i360-line-width) solid var(--i360-border);
      background: color-mix(in srgb, var(--i360-toolbar) 85%, transparent);
      color: var(--i360-icon);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: var(--i360-disabled-opacity);
      transition: opacity var(--i360-speed);
    }
    .floating-btn:hover, .floating-btn:focus-visible { opacity: 1; }
    body.reading .toolbar, body.reading .search-popup, body.reading .side-panel { display: none !important; }
    body.reading .floating-btn { display: flex; }

    /* ---------- Toast ---------- */
    .toast {   /* its look: .i360-toast */
      position: fixed;
      bottom: calc(var(--i360-space-md) + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--i360-speed);
      white-space: nowrap;
    }
    .toast.show { opacity: 0.95; }

    #file-input { display: none; }

    @media print {
      body { height: auto; overflow: visible; background: #fff; }
      .toolbar, .search-popup, .missing-pages-banner, .side-panel, .floating-btn, .toast, .empty-state { display: none !important; }
      .viewer-container { overflow: visible; padding: 0; }
      .pages-wrapper { zoom: 1 !important; width: auto; }
      .page-sheet, .page-sheet.near { box-shadow: none; break-after: page; content-visibility: visible; min-height: 0; background: #fff; color: #000; }
      .page-sheet.bookmarked::before { display: none; }
    }
  </style>
</head>
<body class="i360-page">

  <!-- Toolbar (i360-hub.md §10 "Toolbars"), everything on it as on a wide screen; it follows the UI
       language (in Arabic its start is on the right). Start: ⋮, theme, numerals, the connection
       icon, «فتح ملف»; middle: text size, zoom, the page arrows and number, copy link, bookmark,
       «الصفحة الأصلية» and reading mode; end: search, contents, the title, ✕ (in the app only).
       What folds into ⋮ (its <template data-slot> places), in which order: READER_FOLD,
       src/reader/panel.js. -->
  <header class="toolbar" id="toolbar">
    <div class="tb-start">
      <button class="toolbar-btn" id="btn-more" type="button" aria-controls="more-menu" aria-expanded="false">
        <svg data-icon="menu" data-lucide="ellipsis-vertical" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
      </button>
      <button class="toolbar-btn" id="btn-theme" type="button"></button>
      <button class="toolbar-btn numerals-btn" id="btn-numerals" type="button"></button>
      <div class="divider"></div>
      <span class="status-icon" id="status-icon" role="img"></span>
      <!--@@LABEL_BUTTON id="btn-open-file" icon="openFile" label="Open file" label-id="open-file-label"@@-->
    </div>

    <div class="tb-main">
      <div class="tb-group" id="group-text">
        <button class="toolbar-btn text-size-btn" id="btn-text-smaller" type="button" dir="ltr"></button>
        <button class="toolbar-btn text-size-btn" id="btn-text-larger" type="button" dir="ltr"></button>
      </div>
      <div class="tb-group" id="group-zoom">
        <button class="toolbar-btn" id="btn-zoom-out" type="button">
          <svg data-icon="zoomOut" data-lucide="minus" viewBox="0 0 24 24"><path d="M5 12h14"></path></svg>
        </button>
        <button class="toolbar-btn" id="btn-zoom-in" type="button">
          <svg data-icon="zoomIn" data-lucide="plus" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        </button>
        <button class="toolbar-btn" id="btn-fit-width" type="button">
          <svg data-icon="fitWidth" data-lucide="move-horizontal" viewBox="0 0 24 24"><path d="m18 8 4 4-4 4"></path><path d="M2 12h20"></path><path d="m6 8-4 4 4 4"></path></svg>
        </button>
        <button class="toolbar-btn" id="btn-fit-page" type="button">
          <svg data-icon="fitPage" data-lucide="move-vertical" viewBox="0 0 24 24"><path d="M12 2v20"></path><path d="m8 18 4 4 4-4"></path><path d="m8 6 4-4 4 4"></path></svg>
        </button>
      </div>
      <div class="tb-group" id="group-nav">
        <button class="toolbar-btn" id="btn-nav-left" type="button">
          <svg data-icon="pageLeft" data-lucide="arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        </button>
        <div class="page-counter">
          <select id="vol-select" class="vol-select i360-field" hidden></select>
          <input type="text" inputmode="numeric" autocomplete="off" id="page-num-input" class="page-input i360-field" value="">
          <span id="lbl-of">of</span>
          <span id="total-pages">0</span>
          <span id="page-pos" class="page-pos"></span>
        </div>
        <button class="toolbar-btn" id="btn-nav-right" type="button">
          <svg data-icon="pageRight" data-lucide="arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <button class="toolbar-btn" id="btn-copy-link" type="button" hidden>
        <svg data-icon="copyLink" data-lucide="link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
      </button>
      <div class="tb-group" id="group-mark">
        <template data-slot="copy-link"></template>
        <button class="toolbar-btn" id="btn-bookmark" type="button" aria-pressed="false">
          <svg data-icon="bookmark" data-lucide="bookmark" viewBox="0 0 24 24"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"></path></svg>
        </button>
      </div>
      <div class="tb-group" id="group-acts">
        <button class="toolbar-btn" id="btn-scan" type="button" hidden>
          <svg data-icon="originalPage" data-lucide="scan-text" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 8h8"></path><path d="M7 12h10"></path><path d="M7 16h6"></path></svg>
        </button>
        <button class="toolbar-btn" id="btn-reading" type="button">
          <svg data-icon="readingMode" data-lucide="maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
        </button>
      </div>
    </div>

    <div class="tb-end">
      <button class="toolbar-btn" id="btn-search-toggle" type="button" aria-controls="search-popup" aria-expanded="false">
        <svg data-icon="search" data-lucide="search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
      </button>
      <button class="toolbar-btn" id="btn-panel" type="button" aria-controls="side-panel" aria-expanded="false">
        <svg data-icon="contents" data-lucide="table-of-contents" viewBox="0 0 24 24"><path d="M16 5H3"></path><path d="M16 12H3"></path><path d="M16 19H3"></path><path d="M21 5h.01"></path><path d="M21 12h.01"></path><path d="M21 19h.01"></path></svg>
      </button>
      <span class="tb-title" id="tb-title"></span>
      <button class="toolbar-btn" id="btn-close" type="button" hidden>
        <svg data-icon="close" data-lucide="x" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>

    <!-- The ⋮ menu: what doesn't fit on the bar folds into its slots (fittingToolbar, src/page-chrome.js). -->
    <div class="toolbar-menu" id="more-menu" hidden>
      <template data-slot="volume"></template>
      <div class="tb-group" id="group-fold"><template data-slot="fold-row"></template></div>
      <template data-slot="zoom"></template>
      <template data-slot="text"></template>
      <template data-slot="actions"></template>
      <div class="tb-group" id="group-view">
        <button class="toolbar-btn" id="btn-dir-toggle" type="button"></button>
      </div>
    </div>
  </header>

  <!-- Progress while a book downloads and while its pages are built: a row of its own
       under the toolbar, so it never covers the book. -->
  <div class="progress safe-sides" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden>
    <span class="progress-text" id="progress-text"></span>
    <span class="progress-track"><span class="progress-fill" id="progress-fill"></span></span>
  </div>

  <!-- Search -->
  <div class="search-popup i360-popup" id="search-popup" role="search">
    <div class="search-row">
      <input type="search" id="search-input" class="search-input i360-field i360-field-search" autocomplete="off" enterkeyhint="search">
      <span class="search-count" id="search-count" aria-live="polite">0 of 0</span>
      <button class="toolbar-btn" id="btn-search-prev" type="button">
        <svg data-icon="resultPrevious" data-lucide="arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>
      </button>
      <button class="toolbar-btn" id="btn-search-next" type="button">
        <svg data-icon="resultNext" data-lucide="arrow-down" viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="m19 12-7 7-7-7"></path></svg>
      </button>
      <button class="toolbar-btn" id="btn-search-list" type="button" aria-pressed="false" aria-controls="search-results">
        <svg data-icon="searchResults" data-lucide="list" viewBox="0 0 24 24"><path d="M3 5h.01"></path><path d="M3 12h.01"></path><path d="M3 19h.01"></path><path d="M8 5h13"></path><path d="M8 12h13"></path><path d="M8 19h13"></path></svg>
      </button>
      <button class="toolbar-btn" id="btn-search-close" type="button">
        <svg data-icon="close" data-lucide="x" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>
    <div class="search-row">
      <button class="i360-chip" id="opt-diacritics" type="button" aria-pressed="false"><span class="i360-chip-box"></span><span class="chip-label"></span></button>
      <button class="i360-chip" id="opt-word" type="button" aria-pressed="false"><span class="i360-chip-box"></span><span class="chip-label"></span></button>
    </div>
    <ol class="search-results" id="search-results" hidden></ol>
  </div>

  <!-- Contents and bookmarks -->
  <aside class="side-panel" id="side-panel" aria-hidden="true">
    <div class="panel-head" role="tablist">
      <button class="panel-tab" id="tab-contents" type="button" role="tab" aria-selected="true"></button>
      <button class="panel-tab" id="tab-bookmarks" type="button" role="tab" aria-selected="false"></button>
      <button class="toolbar-btn" id="btn-panel-close" type="button">
        <svg data-icon="close" data-lucide="x" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <button class="floating-btn" id="btn-exit-reading" type="button">
    <svg data-icon="exitReadingMode" data-lucide="minimize" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3"></path><path d="M21 8h-3a2 2 0 0 1-2-2V3"></path><path d="M3 16h3a2 2 0 0 1 2 2v3"></path><path d="M16 21v-3a2 2 0 0 1 2-2h3"></path></svg>
  </button>

  <div class="toast i360-toast" id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="file-input" accept=".md,.markdown,.txt,text/markdown,text/plain">

  <main class="viewer-container safe-area safe-area-top-bar" id="viewer-container" tabindex="-1">
    <div class="missing-pages-banner i360-banner" id="missing-pages-banner" role="status">
      <svg data-icon="warning" data-lucide="triangle-exclamation-point" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
      <div class="missing-pages-text" id="missing-pages-text"></div>
    </div>

    <div class="empty-state" id="empty-state"></div>

    <div class="pages-wrapper" id="pages-wrapper"></div>
  </main>

  <script>/*@@MAIN@@*/</script>
</body>
</html>
